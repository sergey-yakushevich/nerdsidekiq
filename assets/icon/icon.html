<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 1024px; height: 1024px; }
  /* Apple's macOS icon grid: 824x824 content inside a 1024 canvas,
     corner radius 185.4 (the "squircle" approximation). */
  .icon {
    position: absolute;
    left: 100px; top: 100px;
    width: 824px; height: 824px;
    border-radius: 185.4px;
    overflow: hidden;
    background: #0a0a0a;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.06);
  }
  .icon img {
    /* The source art has generous margin; scale up so the character
       fills the icon plate the way a real app icon does. */
    position: absolute;
    width: 112%; height: 112%;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    image-rendering: auto;
  }
</style>
<div class="icon"><img src="../logo/nerdsidekiq-logo-pro.png"></div>
