<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NerdSidekiq Assistant</title>
<link rel="stylesheet" href="node_modules/highlight.js/styles/github-dark.min.css">
<style>
  /* hesoyam dark tokens (shadcn) */
  :root {
    --background: oklch(0.141 0.005 285.823);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.21 0.006 285.885);
    --card-foreground: oklch(0.985 0 0);
    --primary: oklch(0.92 0.004 286.32);
    --primary-foreground: oklch(0.21 0.006 285.885);
    --muted: oklch(0.274 0.006 286.033);
    --muted-foreground: oklch(0.705 0.015 286.067);
    --accent: oklch(0.274 0.006 286.033);
    --border: oklch(1 0 0 / 10%);
    --hesoyam: #FFDB4D;
    --radius: 0.5rem;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; }
  body {
    font-family: -apple-system, "SF Pro Text", Inter, sans-serif;
    color: var(--foreground);
    font-size: 14px;
  }

  /* the Card */
  .assistant {
    height: 100%; display: flex; flex-direction: column;
    background: color-mix(in oklab, var(--background) 94%, transparent);
    border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
    backdrop-filter: blur(20px);
  }

  /* navbar */
  .navbar {
    -webkit-app-region: drag;
    position: relative; display: flex; align-items: center;
    height: 46px; min-height: 46px; padding: 0 10px;
    user-select: none;
  }
  .navbar button { -webkit-app-region: no-drag; }
  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border: 0; border-radius: 8px;
    background: transparent; color: var(--muted-foreground);
    cursor: pointer; font-size: 14px;
  }
  .icon-btn:hover { background: var(--accent); color: var(--foreground); }
  .navbar-center {
    flex: 1; display: flex; justify-content: center; min-width: 0;
  }
  .topic-btn {
    -webkit-app-region: no-drag;
    display: flex; align-items: center; gap: 6px; max-width: 85%;
    border: 0; background: transparent; color: var(--foreground);
    font-size: 13px; font-weight: 600; cursor: pointer;
    padding: 4px 10px; border-radius: 8px;
  }
  .topic-btn:hover { background: var(--accent); }
  .topic-btn .label {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .topic-btn .label.placeholder { color: var(--muted-foreground); font-weight: 500; }
  .spinner {
    width: 13px; height: 13px; flex: none;
    border: 2px solid color-mix(in oklab, var(--hesoyam) 25%, transparent);
    border-top-color: var(--hesoyam);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    display: none;
  }
  .loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* topic history dropdown */
  #topicMenu {
    position: absolute; top: 44px; left: 50%; transform: translateX(-50%);
    min-width: 260px; max-width: 90%; max-height: 300px; overflow-y: auto;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px; z-index: 20;
    box-shadow: 0 8px 30px rgb(0 0 0 / .45);
    display: none;
  }
  #topicMenu.open { display: block; }
  #topicMenu .item {
    display: block; width: 100%; text-align: left;
    padding: 7px 10px; border: 0; border-radius: 7px;
    background: transparent; color: var(--foreground);
    font-size: 12.5px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #topicMenu .item:hover, #topicMenu .item.active { background: var(--accent); }
  #topicMenu .item .n { color: var(--muted-foreground); margin-right: 6px; }

  .hairline { height: 1px; background: var(--border); flex: none; }

  /* content row */
  .content { flex: 1; display: flex; min-height: 0; }

  /* captions sidebar */
  #captions {
    width: 42%; min-width: 180px; max-width: 340px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  body.sidebar-closed #captions,
  body.sidebar-closed .v-divider { display: none; }
  #captions .head {
    padding: 10px 12px 6px; text-align: center;
    font-size: 11px; font-weight: 600; letter-spacing: .05em;
    text-transform: uppercase; color: var(--muted-foreground);
  }
  #captionList {
    flex: 1; overflow-y: auto; padding: 4px 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .bubble {
    max-width: 82%; width: max-content;
    padding: 7px 10px; border-radius: 10px;
    font-size: 12.5px; line-height: 1.45;
    animation: pop .15s ease-out;
  }
  .bubble.them { background: var(--muted); color: var(--foreground); }
  .bubble.you {
    margin-left: auto;
    background: var(--primary); color: var(--primary-foreground);
  }
  .captions-empty {
    color: var(--muted-foreground); font-size: 12px;
    font-style: italic; padding: 8px 4px; text-align: center;
  }
  @keyframes pop { from { transform: translateY(5px); opacity: 0; } }

  .v-divider { width: 1px; background: var(--border); flex: none; }

  /* answer area */
  #answerPane { flex: 1; min-width: 0; overflow-y: auto; padding: 14px 16px; }
  #empty {
    height: 100%; display: flex; flex-direction: column; gap: 6px;
    align-items: center; justify-content: center; text-align: center;
    color: var(--muted-foreground); font-size: 13px;
  }
  #empty .big { font-size: 22px; }
  .question-chip {
    display: inline-block; margin-bottom: 10px;
    font-size: 12px; color: var(--muted-foreground);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 10px; line-height: 1.4;
  }

  /* markdown (prose) */
  .prose { font-size: 13.5px; line-height: 1.6; }
  .prose p, .prose ul, .prose ol, .prose pre, .prose blockquote,
  .prose h1, .prose h2, .prose h3, .prose h4, .prose table { margin-bottom: 10px; }
  .prose h1, .prose h2, .prose h3, .prose h4 { font-weight: 700; line-height: 1.3; }
  .prose h1 { font-size: 17px; } .prose h2 { font-size: 15.5px; }
  .prose h3 { font-size: 14px; } .prose h4 { font-size: 13.5px; }
  .prose ul, .prose ol { padding-left: 20px; }
  .prose li { margin-bottom: 3px; }
  .prose strong { font-weight: 650; }
  .prose a { color: var(--hesoyam); text-decoration: none; }
  .prose blockquote {
    border-left: 3px solid var(--border); padding-left: 10px;
    color: var(--muted-foreground);
  }
  .prose code:not(pre code) {
    background: var(--accent); border-radius: 5px;
    padding: 1px 5px; font-size: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .prose table { border-collapse: collapse; font-size: 12.5px; }
  .prose th, .prose td { border: 1px solid var(--border); padding: 4px 8px; }

  /* CodeEditor block (traffic lights + filename header) */
  .code-editor {
    border: 1px solid var(--border); border-radius: 12px;
    background: color-mix(in oklab, var(--muted) 50%, transparent);
    overflow: hidden;
  }
  .code-editor .head {
    position: relative; display: flex; align-items: center;
    height: 34px; padding: 0 12px;
    background: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .code-editor .dots { display: flex; gap: 6px; }
  .code-editor .dots span { width: 8px; height: 8px; border-radius: 50%; }
  .code-editor .dots .r { background: #ef4444; }
  .code-editor .dots .y { background: #eab308; }
  .code-editor .dots .g { background: #22c55e; }
  .code-editor .file {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 11.5px; font-weight: 600; color: var(--muted-foreground);
  }
  .code-editor pre {
    margin: 0; padding: 10px 12px; overflow-x: auto;
    font-size: 12px; line-height: 1.5;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    background: transparent;
  }
  .code-editor pre code { background: transparent; padding: 0; }

  /* streaming caret */
  .streaming::after {
    content: "▍"; color: var(--muted-foreground);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
  <div class="assistant">
    <div class="navbar" id="navbar">
      <button class="icon-btn" id="sidebarToggle" title="Live captions">☰</button>
      <div class="navbar-center">
        <button class="topic-btn" id="topicBtn">
          <span class="spinner"></span>
          <span class="label placeholder" id="topicLabel">Listening for questions…</span>
          <span style="color:var(--muted-foreground);font-size:10px">▾</span>
        </button>
      </div>
      <button class="icon-btn" id="closeBtn" title="Close">✕</button>
      <div id="topicMenu"></div>
    </div>
    <div class="hairline"></div>
    <div class="content">
      <div id="captions">
        <div class="head">Live captions</div>
        <div id="captionList"><div class="captions-empty">No captions yet.</div></div>
      </div>
      <div class="v-divider"></div>
      <div id="answerPane">
        <div id="empty">
          <div class="big">🎧</div>
          <div>Listening for interviewer questions…</div>
          <div style="font-size:11.5px">Answers appear here automatically.</div>
        </div>
        <div id="answer" style="display:none">
          <span class="question-chip" id="questionChip"></span>
          <div class="prose" id="answerBody"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="node_modules/marked/marked.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const EXT = { javascript:'js', js:'js', typescript:'ts', ts:'ts', python:'py',
      py:'py', java:'java', c:'c', cpp:'cpp', csharp:'cs', cs:'cs', ruby:'rb',
      rb:'rb', php:'php', go:'go', html:'html', css:'css', sql:'sql', swift:'swift',
      rust:'rs', kotlin:'kt', json:'json', shell:'sh', sh:'sh', bash:'sh',
      yaml:'yml', txt:'txt', text:'txt' };

    // markdown: CodeEditor frames + syntax highlight
    marked.use({
      renderer: {
        code({ text, lang }) {
          const l = (lang || '').toLowerCase();
          const ext = EXT[l] || l || 'txt';
          let body;
          try {
            body = l && hljs.getLanguage(l)
              ? hljs.highlight(text, { language: l }).value
              : hljs.highlightAuto(text).value;
          } catch { body = text.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
          return `<div class="code-editor"><div class="head">
            <div class="dots"><span class="r"></span><span class="y"></span><span class="g"></span></div>
            <span class="file">example.${ext}</span></div>
            <pre><code class="hljs">${body}</code></pre></div>`;
        },
      },
    });

    // ---------- state ----------
    const history = [];        // [{question, text, done}]
    let currentIdx = -1;       // which entry is displayed
    let liveIdx = -1;          // which entry is streaming

    const topicLabel = $('topicLabel'), topicBtn = $('topicBtn');
    const answerBody = $('answerBody'), questionChip = $('questionChip');
    const menu = $('topicMenu');

    function shortTopic(q) {
      return q.length > 52 ? q.slice(0, 50).trimEnd() + '…' : q;
    }

    function renderMenu() {
      menu.innerHTML = '';
      history.forEach((h, i) => {
        const b = document.createElement('button');
        b.className = 'item' + (i === currentIdx ? ' active' : '');
        b.innerHTML = `<span class="n">${i + 1}.</span>`;
        b.append(h.question);
        b.onclick = () => { show(i); menu.classList.remove('open'); };
        menu.prepend(b);
      });
    }

    function show(i) {
      currentIdx = i;
      const h = history[i];
      $('empty').style.display = 'none';
      $('answer').style.display = 'block';
      questionChip.textContent = h.question;
      answerBody.innerHTML = marked.parse(h.text || '');
      answerBody.classList.toggle('streaming', i === liveIdx && !h.done);
      topicLabel.textContent = shortTopic(h.question);
      topicLabel.classList.remove('placeholder');
      renderMenu();
    }

    topicBtn.onclick = () => { if (history.length) { renderMenu(); menu.classList.toggle('open'); } };
    document.addEventListener('click', (e) => {
      if (!topicBtn.contains(e.target) && !menu.contains(e.target)) menu.classList.remove('open');
    });
    $('closeBtn').onclick = () => window.close();
    $('sidebarToggle').onclick = () => document.body.classList.toggle('sidebar-closed');

    // ---------- captions ----------
    const captionList = $('captionList');
    function renderCaptions(lines) {
      const stick = captionList.scrollTop + captionList.clientHeight
                    >= captionList.scrollHeight - 30;
      captionList.innerHTML = '';
      if (!lines.length) {
        captionList.innerHTML = '<div class="captions-empty">No captions yet.</div>';
        return;
      }
      for (const l of lines) {
        const d = document.createElement('div');
        d.className = 'bubble ' + (l.who === 'You' ? 'you' : 'them');
        d.title = `${l.who} · ${l.t || ''}`;
        d.textContent = l.text;
        captionList.append(d);
      }
      if (stick) captionList.scrollTop = captionList.scrollHeight;
    }

    // ---------- events from live_loop ----------
    window.nerdsidekiq.onAssist((event) => {
      if (event.type === 'captions') {
        renderCaptions(event.lines || []);
      } else if (event.type === 'question') {
        history.push({ question: event.question, text: '', done: false });
        liveIdx = history.length - 1;
        document.querySelector('.navbar').classList.add('loading');
        document.body.classList.add('loading');
        show(liveIdx);
      } else if (event.type === 'delta' && liveIdx >= 0) {
        history[liveIdx].text += event.text;
        if (currentIdx === liveIdx) {
          const stick = $('answerPane').scrollTop + $('answerPane').clientHeight
                        >= $('answerPane').scrollHeight - 40;
          answerBody.innerHTML = marked.parse(history[liveIdx].text);
          if (stick) $('answerPane').scrollTop = $('answerPane').scrollHeight;
        }
      } else if (event.type === 'done' && liveIdx >= 0) {
        history[liveIdx].done = true;
        if (currentIdx === liveIdx) answerBody.classList.remove('streaming');
        document.body.classList.remove('loading');
        document.querySelector('.navbar').classList.remove('loading');
        liveIdx = -1;
      }
    });
  </script>
</body>
</html>
